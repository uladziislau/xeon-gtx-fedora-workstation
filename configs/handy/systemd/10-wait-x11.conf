# Handy register its global hotkeys (Insert) via X11 (enigo).
# systemd-xdg-autostart-generator starts the unit before KDE imports
# DISPLAY into the user manager, so Handy fails with DisplayNotSet.
# Wait for Xwayland socket, then expose DISPLAY/WAYLAND_DISPLAY.
[Service]
Environment=DISPLAY=:0
Environment=WAYLAND_DISPLAY=wayland-0
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do [ -S /tmp/.X11-unix/X0 ] && exit 0; sleep 1; done; echo "Xwayland socket not ready after 60s, starting anyway" >&2; exit 0'
